name: Build APK

# Builds the signed release APK on every push to main (or by hand from the Actions tab),
# keeps it as a workflow artifact and publishes it as a GitHub Release.
# Direct download link for the newest build:
#   https://github.com/najeem99/Zeropense/releases/latest/download/Zeropense.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Same checks as before a commit: ktlint, unit and screen tests, Android lint.
      - name: Check
        run: ./gradlew ktlintCheck check --stacktrace

      # Signed with app/debug.keystore (the public key the Expo build used), so it installs over the old app.
      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Zeropense.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zeropense-apk
          path: Zeropense.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v${version}-build.${{ github.run_number }}"
          gh release create "$tag" Zeropense.apk \
            --target "${{ github.sha }}" \
            --title "Zeropense ${version} (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Install Zeropense.apk on an Android phone (7.0+). It installs over the existing app and keeps your data." \
            --latest
